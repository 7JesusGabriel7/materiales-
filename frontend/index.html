<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de Venta - Casa de Materiales</title>
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pos.css">
  <link rel="stylesheet" href="./css/ticket.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <aside id="sidebar" class="sidebar" aria-label="Menu principal">
      <div class="sidebar-brand">
        <span class="brand-title" id="sidebar-business-name">Casa de Materiales</span>
        <span class="brand-subtitle">Sistema Punto de Venta</span>
      </div>

      <nav class="sidebar-nav" aria-label="Modulos del sistema">
        <button type="button" class="nav-item active" data-view="pos">
          <span>Ventas (POS)</span>
        </button>
        <button type="button" class="nav-item" data-view="presupuestos">
          <span>Presupuestos</span>
        </button>
        <button type="button" class="nav-item" data-view="entregas">
          <span>Entregas programadas</span>
          <span id="nav-pending-deliveries-badge" class="nav-badge hidden">0</span>
        </button>
        <button type="button" class="nav-item" data-view="por-cobrar">
          <span>Por cobrar</span>
          <span id="nav-pending-payments-badge" class="nav-badge hidden">0</span>
        </button>
        <button type="button" class="nav-item" data-view="productos">
          <span>Productos</span>
        </button>
        <button type="button" class="nav-item" data-view="inventario">
          <span>Inventario</span>
          <span id="nav-low-stock-badge" class="nav-badge hidden">0</span>
        </button>
        <button type="button" class="nav-item" data-view="historial">
          <span>Historial de ventas</span>
        </button>
        <button type="button" class="nav-item" data-view="configuracion">
          <span>Configuracion</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="connection-status">
          <span id="status-indicator" class="status-dot status-checking"></span>
          <span id="status-text">Verificando conexion...</span>
        </div>
        <div id="current-date-label" class="sidebar-date"></div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button
            type="button"
            id="btn-mobile-menu"
            class="btn btn-secondary btn-sm mobile-menu-btn"
            aria-label="Abrir menu"
            aria-expanded="false"
          >
            Menu
          </button>
          <h1 id="page-title" class="page-title">Modulo de ventas</h1>
        </div>
        <div class="topbar-right">
          <span id="topbar-business-info" class="topbar-meta"></span>
        </div>
      </header>

      <main id="main-content" class="main-content">
        <section id="vista-pos" class="view-section active" aria-labelledby="page-title"></section>
        <section id="vista-presupuestos" class="view-section hidden"></section>
        <section id="vista-entregas" class="view-section hidden"></section>
        <section id="vista-por-cobrar" class="view-section hidden"></section>
        <section id="vista-productos" class="view-section hidden"></section>
        <section id="vista-inventario" class="view-section hidden"></section>
        <section id="vista-historial" class="view-section hidden"></section>
        <section id="vista-configuracion" class="view-section hidden"></section>
      </main>
    </div>
  </div>

  <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true"></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Contenedor exclusivo para impresion termica de 58 mm -->
  <div id="print-ticket-container" class="print-ticket-container" aria-hidden="true"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
